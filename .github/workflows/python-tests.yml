name: Python Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test imports
      run: |
        python -c "import config; print('✓ config')"
        python -c "import email_validator; print('✓ email_validator')"
        python -c "import email_sender; print('✓ email_sender')"
        python -c "import spam_checker; print('✓ spam_checker')"
        python -c "import bounce_handler; print('✓ bounce_handler')"
        python -c "import engagement_tracker; print('✓ engagement_tracker')"
        python -c "import opt_in_manager; print('✓ opt_in_manager')"
        python -c "import domain_auth_checker; print('✓ domain_auth_checker')"
        python -c "import compliance_footer; print('✓ compliance_footer')"
        python -c "import stats_dashboard; print('✓ stats_dashboard')"
        python -c "import template_manager; print('✓ template_manager')"
        echo "All imports successful!"
