<!-- Email Inline Form -->
<div class="email-signup-form" style="max-width: 500px; margin: 40px auto; padding: 30px; background: #f8f9fa; border-radius: 10px; font-family: Arial, sans-serif;">
    <h3 style="margin: 0 0 10px 0; color: #667eea;">Subscribe to Our Newsletter</h3>
    <p style="margin: 0 0 20px 0; color: #666; font-size: 14px;">Get the latest updates and exclusive offers</p>
    
    <form id="emailSignupForm" onsubmit="handleSignup(event); return false;" style="display: flex; gap: 10px; flex-wrap: wrap;">
        <input type="email" 
               name="email" 
               placeholder="Enter your email" 
               required
               style="flex: 1; min-width: 200px; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 5px; font-size: 14px;" />
        
        <button type="submit" 
                style="padding: 12px 30px; background: #667eea; color: white; border: none; border-radius: 5px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.3s;">
            Subscribe
        </button>
    </form>
    
    <p style="margin: 15px 0 0 0; font-size: 12px; color: #888;">
        🔒 We respect your privacy. Unsubscribe at any time.
    </p>
</div>

<script>
function handleSignup(event) {
    event.preventDefault();
    const form = event.target;
    const email = form.email.value;
    
    // Send to your server
    fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            form.innerHTML = '<p style="color: #28a745; font-weight: 600;">✓ Thank you for subscribing!</p>';
        } else {
            alert('Error: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('An error occurred. Please try again.');
    });
}
</script>
<!-- End Email Inline Form -->
