<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background: #FFD700; max-width: 600px; margin: 0 auto; }
        .container { background: #000; color: #fff; padding: 50px 40px; }
        h1 { font-size: 42px; font-weight: 900; margin: 0 0 20px 0; text-transform: uppercase; letter-spacing: 2px; }
        p { font-size: 18px; line-height: 1.8; color: #ccc; }
        .highlight { color: #FFD700; font-weight: bold; }
        .button { display: inline-block; padding: 20px 50px; background: #FFD700; color: #000; text-decoration: none; font-weight: bold; font-size: 16px; text-transform: uppercase; margin: 30px 0; }
        .footer { background: #222; color: #666; padding: 20px; text-align: center; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Big News!</h1>
        <p>Hey <span class="highlight">$name</span>,</p>
        <p>We're dropping something <strong class="highlight">MASSIVE</strong> and you're on the list.</p>
        <p>This is the moment you've been waiting for. Don't sleep on this.</p>
        <center><a href="$link" class="button">Get It Now</a></center>
        <p style="font-size:14px;color:#666;">— The $company Team</p>
    </div>
    <div class="footer">© $company | <a href="$unsubscribe_link" style="color:#666;">Unsubscribe</a></div>
</body>
</html>
