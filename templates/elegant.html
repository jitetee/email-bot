<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Georgia, 'Times New Roman', serif; background: #f9f6f3; max-width: 600px; margin: 0 auto; }
        .container { background: #fff; border: 2px solid #c9a959; padding: 50px 40px; }
        .header { text-align: center; border-bottom: 2px solid #c9a959; padding-bottom: 20px; margin-bottom: 30px; }
        .header h1 { font-size: 32px; color: #c9a959; margin: 0; font-style: italic; }
        p { font-size: 16px; line-height: 1.8; color: #444; }
        .greeting { font-size: 18px; color: #c9a959; }
        .button { display: inline-block; padding: 15px 40px; border: 2px solid #c9a959; color: #c9a959; text-decoration: none; font-size: 14px; letter-spacing: 1px; margin: 25px 0; }
        .signature { font-style: italic; color: #666; margin-top: 30px; }
        .footer { text-align: center; font-size: 11px; color: #999; margin-top: 30px; border-top: 1px solid #ddd; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>$company</h1>
        </div>
        <p class="greeting">Dear $name,</p>
        <p>We cordially invite you to explore our exclusive collection, curated with discerning individuals like yourself in mind.</p>
        <p>Experience the epitome of quality and sophistication.</p>
        <center><a href="$link" class="button">DISCOVER MORE</a></center>
        <p class="signature">With warm regards,<br>The $company Team</p>
        <div class="footer">© $company. All rights reserved. | <a href="$unsubscribe_link" style="color:#999;">Unsubscribe</a></div>
    </div>
</body>
</html>
