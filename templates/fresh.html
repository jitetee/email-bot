<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, sans-serif; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); max-width: 600px; margin: 0 auto; padding: 20px; }
        .container { background: #fff; border-radius: 20px; padding: 40px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        h1 { color: #2d9cdb; font-size: 32px; margin: 0; }
        .flower { font-size: 40px; }
        p { color: #555; line-height: 1.7; font-size: 16px; }
        .offer { background: linear-gradient(135deg, #a8edea, #fed6e3); padding: 25px; border-radius: 15px; text-align: center; margin: 25px 0; }
        .offer h2 { color: #2d9cdb; margin: 0 0 10px 0; font-size: 28px; }
        .button { display: inline-block; padding: 15px 40px; background: linear-gradient(135deg, #2d9cdb, #6dd5ed); color: #fff; text-decoration: none; border-radius: 30px; font-weight: 600; font-size: 16px; margin: 20px 0; }
        .footer { text-align: center; font-size: 12px; color: #999; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="flower">🌸</span>
            <h1>Hello, $name!</h1>
        </div>
        <p>Spring into savings! We're blooming with excitement to share this offer with you.</p>
        <div class="offer">
            <h2>🌼 50% OFF 🌼</h2>
            <p>Use code: <strong>FRESH50</strong></p>
        </div>
        <p>Fresh deals, fresh looks, fresh starts. What are you waiting for?</p>
        <center><a href="$link" class="button">Shop Fresh</a></center>
        <div class="footer">© $company | <a href="$unsubscribe_link" style="color:#ccc;">Unsubscribe</a></div>
    </div>
</body>
</html>
