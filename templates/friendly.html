<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #e3f2fd; max-width: 600px; margin: 0 auto; padding: 20px; }
        .container { background: #fff; border-radius: 16px; padding: 35px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .wave { font-size: 50px; text-align: center; display: block; }
        h1 { color: #1976d2; font-size: 28px; text-align: center; margin: 15px 0; }
        p { color: #555; line-height: 1.6; font-size: 15px; }
        .friend-box { background: #e3f2fd; border-radius: 12px; padding: 20px; margin: 25px 0; text-align: center; }
        .friend-box h2 { color: #1976d2; margin: 0 0 10px 0; font-size: 24px; }
        .button { display: inline-block; padding: 14px 35px; background: #1976d2; color: #fff; text-decoration: none; border-radius: 25px; font-weight: 600; margin: 20px 0; }
        .footer { text-align: center; font-size: 12px; color: #999; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <span class="wave">👋</span>
        <h1>Hey $name!</h1>
        <p>Hope you're having an awesome day! We just wanted to drop by and share something cool with you.</p>
        <div class="friend-box">
            <h2>🎉 50% OFF!</h2>
            <p>Use code: <strong>FRIEND50</strong></p>
        </div>
        <p>Because you're awesome and you deserve it! 😊</p>
        <center><a href="$link" class="button">Let's Go!</a></center>
        <p style="text-align:center;margin-top:25px;">Your friends at $company</p>
        <div class="footer">© $company | <a href="$unsubscribe_link" style="color:#ccc;">Unsubscribe</a></div>
    </div>
</body>
</html>
