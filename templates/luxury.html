<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Times New Roman', serif; background: #1a1a1a; max-width: 600px; margin: 0 auto; }
        .container { background: linear-gradient(180deg, #1a1a1a 0%, #2d2d2d 100%); padding: 50px 40px; border: 1px solid #c9a959; }
        .logo { text-align: center; font-size: 32px; color: #c9a959; margin-bottom: 40px; letter-spacing: 8px; font-weight: bold; }
        h1 { color: #fff; font-size: 28px; text-align: center; font-weight: 300; margin-bottom: 30px; }
        p { color: #aaa; line-height: 1.8; font-size: 15px; text-align: center; }
        .gold-box { border: 1px solid #c9a959; padding: 30px; margin: 30px 0; background: rgba(201,169,89,0.1); }
        .gold-box h2 { color: #c9a959; font-size: 36px; margin: 0; font-weight: 300; }
        .button { display: inline-block; padding: 18px 50px; background: #c9a959; color: #1a1a1a; text-decoration: none; font-size: 14px; letter-spacing: 3px; margin: 30px 0; text-transform: uppercase; }
        .footer { text-align: center; font-size: 11px; color: #555; margin-top: 40px; border-top: 1px solid #333; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">$company</div>
        <h1>Excellence Awaits</h1>
        <p>Dear $name,</p>
        <p>You are cordially invited to experience the pinnacle of luxury and sophistication.</p>
        <div class="gold-box">
            <h2>50% Privilege</h2>
            <p style="margin-top:15px;">Code: <span style="color:#c9a959;">LUXURY50</span></p>
        </div>
        <center><a href="$link" class="button">Discover</a></center>
        <div class="footer">© $company | <a href="$unsubscribe_link" style="color:#555;">Unsubscribe</a></div>
    </div>
</body>
</html>
