<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
        .container { background: #fff; padding: 40px; border: 1px solid #e0e0e0; border-radius: 8px; }
        .logo { font-size: 24px; font-weight: bold; color: #000; margin-bottom: 30px; }
        h1 { font-size: 28px; margin-bottom: 20px; color: #111; }
        p { margin-bottom: 15px; color: #555; }
        .button { display: inline-block; padding: 12px 30px; background: #000; color: #fff; text-decoration: none; border-radius: 4px; margin: 20px 0; }
        .divider { height: 1px; background: #e0e0e0; margin: 30px 0; }
        .footer { font-size: 12px; color: #888; margin-top: 30px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">$company</div>
        <h1>Hello $name,</h1>
        <p>We have something special for you. Our exclusive offer is now available for a limited time.</p>
        <p>Don't miss out on this opportunity to experience the best.</p>
        <center><a href="$link" class="button">Learn More</a></center>
        <div class="divider"></div>
        <p class="footer">© $company. <a href="$unsubscribe_link" style="color:#888;">Unsubscribe</a></p>
    </div>
</body>
</html>
