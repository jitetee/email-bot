<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Comic Sans MS', cursive, sans-serif; background: linear-gradient(180deg, #ff9a9e 0%, #fecfef 100%); max-width: 600px; margin: 0 auto; }
        .container { background: #fff; border-radius: 20px; padding: 40px; margin: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        h1 { font-size: 36px; color: #ff6b9d; text-align: center; margin-bottom: 10px; }
        .emoji { font-size: 50px; text-align: center; display: block; margin: 20px 0; }
        p { font-size: 16px; color: #555; line-height: 1.6; }
        .button { display: inline-block; padding: 15px 40px; background: linear-gradient(45deg, #ff6b9d, #ff9a9e); color: #fff; text-decoration: none; border-radius: 50px; font-weight: bold; font-size: 16px; margin: 20px 0; }
        .footer { text-align: center; font-size: 12px; color: #999; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <span class="emoji">🎉✨🌟</span>
        <h1>Hey $name!</h1>
        <p style="text-align:center;">Guess what? We've got something SUPER exciting for you! 💝</p>
        <p>You're one of our favorite people, so we're giving you FIRST access to our amazing new stuff!</p>
        <span class="emoji">🚀💫🎁</span>
        <center><a href="$link" class="button">Let's Go! →</a></center>
        <p style="text-align:center;">XOXO,<br>The $company Fam 💕</p>
        <div class="footer">© $company | <a href="$unsubscribe_link" style="color:#ccc;">No thanks</a></div>
    </div>
</body>
</html>
