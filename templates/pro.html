<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f8f9fa; max-width: 600px; margin: 0 auto; }
        .container { background: #fff; }
        .header { background: #1a365d; padding: 30px 40px; }
        .header h1 { color: #fff; font-size: 24px; margin: 0; font-weight: 500; }
        .content { padding: 40px; }
        .greeting { font-size: 18px; color: #1a365d; margin-bottom: 20px; }
        p { color: #4a5568; line-height: 1.7; font-size: 15px; margin-bottom: 15px; }
        .stats { display: table; width: 100%; margin: 25px 0; }
        .stat { display: table-cell; width: 33%; text-align: center; padding: 15px; background: #f7fafc; border-radius: 8px; }
        .stat-num { font-size: 24px; font-weight: bold; color: #2b6cb0; }
        .stat-label { font-size: 12px; color: #718096; text-transform: uppercase; }
        .button { display: inline-block; padding: 14px 35px; background: #2b6cb0; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 500; margin: 25px 0; }
        .footer { background: #edf2f7; padding: 25px 40px; text-align: center; font-size: 12px; color: #718096; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>$company</h1>
        </div>
        <div class="content">
            <p class="greeting">Dear $name,</p>
            <p>Thank you for being a valued customer. We're pleased to offer you exclusive access to our premium services.</p>
            <div class="stats">
                <div class="stat"><div class="stat-num">50%</div><div class="stat-label">Discount</div></div>
                <div class="stat"><div class="stat-num">24/7</div><div class="stat-label">Support</div></div>
                <div class="stat"><div class="stat-num">100%</div><div class="stat-label">Satisfaction</div></div>
            </div>
            <p>Experience the difference that quality makes.</p>
            <center><a href="$link" class="button">Get Started</a></center>
        </div>
        <div class="footer">© $company | <a href="$unsubscribe_link" style="color:#718096;">Unsubscribe</a></div>
    </div>
</body>
</html>
