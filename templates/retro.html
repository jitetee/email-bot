<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Arial Black', sans-serif; background: #ff6b6b; max-width: 600px; margin: 0 auto; }
        .container { background: #ffe66d; border: 4px solid #1a1a2e; padding: 30px; }
        .header { background: #1a1a2e; color: #ffe66d; padding: 20px; text-align: center; border: 3px solid #1a1a1a; }
        h1 { font-size: 32px; margin: 0; text-transform: uppercase; letter-spacing: 3px; }
        .marquee { background: #4ecdc4; color: #1a1a2e; padding: 15px; text-align: center; font-size: 18px; border: 3px solid #1a1a2e; margin: 20px 0; }
        p { color: #1a1a2e; font-size: 16px; line-height: 1.5; }
        .box { background: #ff6b6b; border: 3px solid #1a1a2e; padding: 20px; text-align: center; margin: 20px 0; }
        .box h2 { font-size: 36px; margin: 0; color: #ffe66d; text-shadow: 2px 2px #1a1a2e; }
        .button { display: inline-block; padding: 15px 40px; background: #1a1a2e; color: #ffe66d; text-decoration: none; font-size: 16px; border: 3px solid #1a1a2e; margin: 20px 0; text-transform: uppercase; }
        .footer { text-align: center; font-size: 11px; color: #1a1a2e; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>★ $company ★</h1>
        </div>
        <div class="marquee">
            ★★★ HOT DEAL ALERT ★★★
        </div>
        <p>Hey $name!</p>
        <p>Get ready to ROCK with our RADICAL new collection!</p>
        <div class="box">
            <h2>50% OFF</h2>
            <p>Use code: RETRO50</p>
        </div>
        <center><a href="$link" class="button">→ Shop Now ←</a></center>
        <div class="footer">© $company | <a href="$unsubscribe_link" style="color:#1a1a2e;">Unsubscribe</a></div>
    </div>
</body>
</html>
