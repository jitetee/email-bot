<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(45deg, #ff0844 0%, #ffb199 100%); max-width: 600px; margin: 0 auto; padding: 20px; }
        .container { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .header { background: linear-gradient(45deg, #ff0844, #ffb199); padding: 40px; text-align: center; }
        .header h1 { color: #fff; font-size: 36px; margin: 0; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .content { padding: 40px; }
        p { color: #333; line-height: 1.6; font-size: 16px; }
        .mega-off { background: #ff0844; color: #fff; padding: 30px; text-align: center; margin: 25px 0; border-radius: 10px; }
        .mega-off h2 { font-size: 48px; margin: 0; }
        .mega-off p { color: #fff; font-size: 18px; margin: 10px 0 0 0; }
        .button { display: inline-block; padding: 18px 50px; background: #ff0844; color: #fff; text-decoration: none; border-radius: 50px; font-weight: bold; font-size: 18px; margin: 25px 0; box-shadow: 0 10px 30px rgba(255,8,68,0.4); }
        .footer { background: #f5f5f5; padding: 20px; text-align: center; font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔥 BOOM! 🔥</h1>
        </div>
        <div class="content">
            <p>Hey $name!</p>
            <p>We're turning up the heat with our HOTTEST deal of the year!</p>
            <div class="mega-off">
                <h2>50% OFF</h2>
                <p>Code: VIBRANT50</p>
            </div>
            <p>This is NOT a drill. This is the real deal!</p>
            <center><a href="$link" class="button">GRAB IT NOW!</a></center>
        </div>
        <div class="footer">© $company | <a href="$unsubscribe_link" style="color:#888;">No thanks</a></div>
    </div>
</body>
</html>
