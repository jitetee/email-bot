<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff9f5; max-width: 600px; margin: 0 auto; }
        .container { background: #fff; padding: 40px; }
        .header { text-align: center; padding: 30px 0; }
        .header h1 { color: #e85d3d; font-size: 28px; margin: 0; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #e85d3d, #f5a623); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 32px; }
        p { color: #4a4a4a; line-height: 1.7; font-size: 16px; }
        .highlight { background: #fff3e0; padding: 20px; border-radius: 12px; margin: 25px 0; text-align: center; }
        .highlight h2 { color: #e85d3d; margin: 0 0 10px 0; }
        .button { display: inline-block; padding: 14px 35px; background: #e85d3d; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; margin: 20px 0; }
        .footer { text-align: center; font-size: 12px; color: #999; margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="avatar">👋</div>
            <h1>Hi $name!</h1>
        </div>
        <p>We hope this email finds you well. We wanted to reach out with something special just for you.</p>
        <p>As a valued member of the $community, you deserve the very best.</p>
        <div class="highlight">
            <h2>🎁 Your Gift Awaits</h2>
            <p>Use code <strong>WELCOME50</strong> for 50% off</p>
        </div>
        <center><a href="$link" class="button">Claim Your Gift</a></center>
        <p>Warmly,<br>The $company Team</p>
        <div class="footer">© $company | <a href="$unsubscribe_link" style="color:#999;">Unsubscribe</a></div>
    </div>
</body>
</html>
