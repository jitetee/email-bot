<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Palatino Linotype', Georgia, serif; background: #e8e4e1; max-width: 600px; margin: 0 auto; padding: 30px; }
        .container { background: #fff; padding: 50px 40px; border-radius: 4px; }
        .logo { text-align: center; font-size: 28px; color: #5d5c61; margin-bottom: 30px; letter-spacing: 5px; }
        h1 { font-size: 26px; color: #5d5c61; text-align: center; font-weight: 300; margin-bottom: 30px; }
        p { color: #777; line-height: 2; font-size: 15px; text-align: center; }
        .quote { border-left: 3px solid #b8a99a; padding-left: 20px; margin: 30px 0; font-style: italic; color: #999; text-align: left; }
        .button { display: inline-block; padding: 12px 40px; border: 1px solid #5d5c61; color: #5d5c61; text-decoration: none; font-size: 13px; letter-spacing: 2px; margin: 30px 0; }
        .footer { text-align: center; font-size: 11px; color: #aaa; margin-top: 40px; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">$company</div>
        <h1>Find Your Balance</h1>
        <p>Dear $name,</p>
        <p>In a world of chaos, find your moment of calm. Our curated collection brings harmony to your everyday.</p>
        <div class="quote">
            "Simplicity is the ultimate sophistication."<br>
            <span style="font-size:12px;">— Leonardo da Vinci</span>
        </div>
        <p>Discover peace in every detail.</p>
        <center><a href="$link" class="button">EXPLORE</a></center>
        <div class="footer">© $company | <a href="$unsubscribe_link" style="color:#aaa;">Unsubscribe</a></div>
    </div>
</body>
</html>
